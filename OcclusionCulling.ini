; Occlusion Culling - Data\NVSE\Plugins\OcclusionCulling.ini (read when the game starts)
; Large objects that the graphics card proves are fully covered by what is already drawn are not drawn in the main
; view. Shadows, reflections, actors, doors, lights and anything near the camera are never touched. Numbers, including
; the frame time with hiding on and off, go to logs\OcclusionCulling.log in the game folder.

[General]
; 0 = the plugin does nothing at all (no hooks)
bEnabled=1
; Hiding at start: 1 = on, 0 = off (measuring only). The key below switches it while you play.
bCulling=1
; On/off key, DirectInput scancode in decimal: 210 = Insert, 199 = Home, 207 = End, 211 = Delete, 0 = none.
; A message in the corner says ON or OFF. Not read while a menu or the console is open.
iToggleKey=210

[Candidates]
; Objects smaller than this radius (game units) are never tested. Lower it (e.g. 75) to also hide smaller clutter;
; more objects are tested, so each frame's tests cost a little more.
fMinRadius=150
; Objects whose box is closer to the camera than this are never tested
fNearDistance=400
; 1 = also test distant LOD objects (the far, low-detail copies of buildings and rocks; about 200 per frame outdoors)
bDistantLOD=0
; 1 = imposters are tested too: references the game shows at any distance (never faded out), mostly big buildings
; and landmarks in loaded cells. They are hidden like other objects when proven covered.
bImposters=1

[Queries]
; Tests (occlusion queries) issued per frame at most
iMaxQueriesPerFrame=500
; Oldest answer, in frames, that may still count
iMaxAnswerAge=4
; A visible object is tested again only every this many frames (1-16); covered and new objects are tested first.
; Lower = objects that become covered are hidden sooner, but each frame runs more tests.
iVisibleRetestFrames=4
; An answer is not used after the camera turned more than this many degrees, or moved more than this many units,
; per frame of the answer's age
fGuardDegreesPerFrame=2.5
fGuardUnitsPerFrame=32
; Pop-in when stepping out from behind a wall: while the camera moves, the test boxes of hidden things grow on screen
; by how far the move slides an edge this many units away, so they show up a frame early. Lower = grows more (less
; pop-in, a little less hidden while moving). 0 = off. Standing still (or nearly) nothing grows. A grown box that shows
; pixels draws its object and tests it again the next frame, so an early reveal costs about two frames.
fRevealDepth=150

[Land]
; 1 = land quadrants (each cell's ground in four 2048 x 2048 unit squares) are tested and hidden like objects when
; proven covered, e.g. ground behind buildings, walls and hills. The box is the quadrant's own height range.
bLandCulling=1
; Game units added above and below that height range (tessellated land is pushed up and down a little)
fLandMargin=32
; 1 = distant terrain LOD chunks (the low-detail land beyond the loaded cells) are tested and hidden the same way
bTerrainLOD=1

[Grass]
; 1 = grass groups are tested and hidden like land when proven covered (grass behind walls, buildings and hills)
bGrassCulling=1
; Game units added around a grass group's box on every side (blades sway in the wind)
fGrassMargin=32

[Lamps]
; Each lamp's reach (a box around its radius) is tested like the objects. When no visible pixel lies inside it, nothing
; the lamp could light is on screen. 0 = only count such lamps in the log; 1 = also switch them off for the main view
; (saves the extra lighting passes of every shape they touch). Lamps near the camera are never switched off.
bLampCulling=0

[Actors]
; 1 = NPCs and creatures (never the player) are tested and hidden like objects when proven covered. Skipping them is
; what the game does when they are outside the view: animation, AI and their shadows go on as normal. An actor is
; hidden only while it is still inside the box that was proven covered (its bound plus a margin).
bActorCulling=1
; Margin around an actor's bound, game units (plus 10% of its size). Larger = shown a little sooner when stepping out.
fActorMargin=24
; Actors the main view does not draw (behind cover, or outside the view) and that are at least fAnimNearDistance
; away update their bones every iAnimInterval frames instead of every frame. Their animations, AI and movement still
; run every frame; only the bone positions wait. Their shadows (and a pose seen the frame one turns into view) can lag
; by up to iAnimInterval-1 frames. 0 = every actor every frame.
bAnimThrottle=1
; 2 = every other frame (1 = off)
iAnimInterval=2
; Game units; closer actors always update every frame
fAnimNearDistance=512

[Particles]
; 1 = particle systems (fire, smoke, sparks, steam) on objects behind cover or outside the view, at least
; fParticleNearDistance away, are stepped only every iParticleInterval frames; the skipped time is caught up at
; the next step. Particles in view or nearby update every frame.
bParticleThrottle=1
; 3 = every third frame (1 = off)
iParticleInterval=3
; Game units; closer particle systems always update every frame
fParticleNearDistance=512

[Activators]
; 1 = doors, activators, talking activators and terminals are tested and hidden when proven covered. They can open
; or animate, so like actors their box follows them every frame and they are hidden only while still inside the
; box that was proven covered. Ones with nothing to draw (trigger boxes) are never tested.
bActivatorCulling=1
; Margin around their bound, game units (plus 5% of their size). Larger = shown a little sooner when they move.
fActivatorMargin=16

[Trees]
; 1 = SpeedTree trees and shrubs (the Mojave scrub bushes, oaks; about 18,400 placed in the base game) are tested and
; hidden like objects when proven covered. Joshua trees and most dead trees are ordinary objects, already handled.
bTreeCulling=1
; Room around a tree's bound for its leaf cards, game units (plus 20% of its size): the leaves are spread out on the
; graphics card, outside the bound the game keeps. Larger = safer at the edges of the leaves, hidden a little less.
fTreeMargin=32

[Boxes]
; 1 = tighter boxes: each shape's own vertices give its exact extent, and the box follows the object's rotation (a wall
; placed at an angle gets a box along the wall, not a big square around it). Tighter boxes are found covered more often.
; Shapes whose vertices the game has already freed keep their bound spheres; animated objects keep the old box.
bOrientedBoxes=1

[Debug]
; Compare key: switches one feature at a time against the settings above: as set -> land switched -> grass
; switched -> throttles switched (actor bones and particles) -> as set. 207 = End, 0 = none.
; The log starts a new block at each press, so the numbers of each mode stay apart.
iCompareKey=207
; Frames of world view per block of numbers in the log
iLogInterval=600
; 1 = draw the tested boxes: green = visible, red = hidden (red ones show through walls); NPCs and creatures
; are cyan when visible, magenta when hidden
; (With NVR P83's LampSums/PassSums on, the boxes land in its lamp-light buffer and may look tinted or faint;
;  that only affects these debug lines, never the measuring.)
bDebugBoxes=0
