; Occlusion Culling - Data\NVSE\Plugins\OcclusionCulling.ini (read when the game starts)
; Large objects that the graphics card proves are fully covered by what is already drawn are not drawn in the main
; view. Shadows, reflections, actors, doors, lights and anything near the camera are never touched. Numbers, including
; the frame time with hiding on and off, go to logs\OcclusionCulling.log in the game folder.

[General]
; 0 = the plugin does nothing at all (no hooks)
bEnabled=1
; Hiding at start: 1 = on, 0 = off (measuring only). The key below switches it while you play.
bCulling=1
; On/off key, DirectInput scancode in decimal: 210 = Insert, 199 = Home, 207 = End, 211 = Delete, 0 = none.
; A message in the corner says ON or OFF. Not read while a menu or the console is open.
iToggleKey=210

[Candidates]
; Objects smaller than this radius (game units) are never tested. Lower it (e.g. 75) to also hide smaller clutter;
; more objects are tested, so each frame's tests cost a little more.
fMinRadius=150
; Objects whose box is closer to the camera than this are never tested
fNearDistance=400
; 1 = also test distant LOD objects (the far, low-detail copies of buildings and rocks; about 200 per frame outdoors)
bDistantLOD=0

[Queries]
; Tests (occlusion queries) issued per frame at most
iMaxQueriesPerFrame=500
; Oldest answer, in frames, that may still count
iMaxAnswerAge=4
; A visible object is tested again only every this many frames (1-16); covered and new objects are tested first.
; Lower = objects that become covered are hidden sooner, but each frame runs more tests.
iVisibleRetestFrames=4
; An answer is not used after the camera turned more than this many degrees, or moved more than this many units,
; per frame of the answer's age
fGuardDegreesPerFrame=2.5
fGuardUnitsPerFrame=32

[Debug]
; Frames of world view per block of numbers in the log
iLogInterval=600
; 1 = draw the tested boxes: green = visible, red = hidden (red ones show through walls)
; (With NVR P83's LampSums/PassSums on, the boxes land in its lamp-light buffer and may look tinted or faint;
;  that only affects these debug lines, never the measuring.)
bDebugBoxes=0
